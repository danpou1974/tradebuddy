name: Datos para grid HYPE
on:
  push:
    branches: [hl-wallet-scout]
    paths: ['scripts/grid_calc.mjs']
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/grid_calc.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -m "grid data [skip ci]" && git pull --rebase && git push
